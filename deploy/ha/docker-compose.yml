# Одна машина управления в docker-режиме: etcd + PostgreSQL/Patroni + telemux.
# Запускается одинаково на каждой из трёх машин, отличаются только env-файлы.
# См. docs/adr/0002-master-failover.md, раздел «Установка».
#
# network_mode: host - участники etcd и Patroni должны анонсировать реальные адреса
# машины соседям; через docker-NAT кворум и репликация ломаются на асимметричных путях.
services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    network_mode: host
    env_file: /etc/telemux/etcd.env           # из deploy/etcd/etcd.env.example
    volumes:
      - etcd-data:/var/lib/etcd
      - /etc/etcd/pki:/etc/etcd/pki:ro
    restart: always

  patroni:
    build:
      context: .
      dockerfile: Dockerfile.patroni
    network_mode: host
    volumes:
      - /etc/telemux/patroni.yml:/etc/patroni/patroni.yml:ro   # из deploy/patroni/patroni.yml.example
      - /etc/etcd/pki:/etc/etcd/pki:ro
      - pgdata:/var/lib/postgresql/16/main
    # Watchdog: демоут гарантирован даже при зависшем Patroni. На хосте: modprobe softdog
    # и права группы контейнера на /dev/watchdog.
    devices:
      - /dev/watchdog:/dev/watchdog
    shm_size: 256m
    stop_grace_period: 60s   # Patroni успевает аккуратно отдать лидерство
    depends_on: [ etcd ]
    restart: always

  telemux:
    image: ghcr.io/andreyosipuk/telemux:latest
    network_mode: host
    env_file: /etc/telemux/telemux.env        # из deploy/telemux.env.example
    # DATABASE_URL=postgres://telemux:...@127.0.0.1:5432/telemux
    # TELEMUX_PATRONI_URL=http://127.0.0.1:8008
    depends_on: [ patroni ]
    restart: always

volumes:
  etcd-data: {}
  pgdata: {}
