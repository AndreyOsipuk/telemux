openapi: 3.0.3
info:
  title: telemux API
  version: "1"
  description: |
    Единый источник правды для HTTP-API telemux: бэкенд проверяется по этой
    спеке в тестах, панель генерирует из неё типы.

    Ошибки - в формате `Error`. 4xx - ошибка запроса, 503 - недоступна база или
    мастер, 500 - баг. Запись принимает только мастер: на остальных узлах -
    409 с кодом `not_master` и заголовком `X-Telemux-Master`.
servers:
  - url: /
security:
  - botToken: []
  - session: []
paths:
  /api/v1/users:
    put:
      summary: Полный набор пользователей от бота
      description: |
        Сверка: пользователи из набора создаются или обновляются, отсутствующие
        удаляются. Затем публикуется ревизия желаемого состояния машин.
        Защита от массового удаления: пустой набор или удаление больше 20% при
        10+ пользователях - 409 `mass_delete_guard`, пока не передан `force=true`.
      operationId: putUsers
      parameters:
        - name: force
          in: query
          schema: { type: boolean }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [users]
              properties:
                users:
                  type: array
                  maxItems: 50000
                  items: { $ref: '#/components/schemas/User' }
      responses:
        '200':
          description: Набор применён, ревизия опубликована
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Publish'
                  - type: object
                    required: [inserted, updated, deleted]
                    properties:
                      inserted: { type: integer }
                      updated: { type: integer }
                      deleted: { type: integer }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/users/{key}:
    parameters:
      - $ref: '#/components/parameters/UserKey'
    put:
      summary: Создать или изменить одного пользователя
      operationId: putUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserBody' }
      responses:
        '200':
          description: Пользователь изменён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PointChange' }
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PointChange' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    delete:
      summary: Удалить пользователя
      operationId: deleteUser
      responses:
        '200':
          description: Удалён, ревизия опубликована
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Publish' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/targets:
    post:
      summary: Добавить машину (кнопка «Добавить машину» в панели)
      description: |
        Заводит машину и сразу выдаёт одноразовую команду установки агента (как POST .../join).
        Только мастер. Код - `^[a-z][a-z0-9-]{1,31}$`, занятый код - 409. Для выхода (`exit`)
        обязательны `relay_code` (существующий релей), `address` (публичный IPv4 выхода) и
        `bridge_socks` (адрес socks-входа на релее, через который релей ходит в этот выход,
        например `socks5://127.0.0.1:10872`). Релею можно задать `address` - его публичный
        IPv4 для сборки `telemt.config`. Ресурсы - из `telemt.users`, `mtg.config`, `mtg.secondary.config` (второй процесс на релее, вместе с основным).
        Если на мастере настроена цепочка файрвола (`TELEMUX_AGENT_FW_CHAIN`), адрес выхода
        сразу открывается на TLS-порту агентов. Релея из `relay_code` нет (или это машина не
        вида `relay`) - 400 `unknown_machine`. Пары «релей - своя нода» берутся только из
        `relay_code` выходов; карта серверов на них не влияет.
        Новый релей ходит к мастеру через мост своего выхода, а выходов у него ещё нет: машина
        заводится, `command` пустая, токен не выпускается - добавьте выход и вызовите POST .../join.
        Не задан `TELEMUX_AGENT_PUBLIC_URL` или нет сертификата API агентов - 409 до создания машины.
      operationId: createTarget
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewTarget' }
      responses:
        '201':
          description: Машина заведена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JoinCommand' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/targets/{code}/join:
    post:
      summary: Новая одноразовая команда установки агента
      description: |
        Выдаёт свежий одноразовый токен (живёт 1 час) и команду для новой машины. Прежний
        неиспользованный токен этой машины сгорает. Только мастер. Неизвестная машина - 404.
        Выход идёт на мастер напрямую по TLS с проверкой ключа сертификата (`--pinnedpubkey`);
        релей - через мост первого своего выхода (`-x <bridge_socks> http://<address выхода>:18480`).
        Релей без выходов с адресом и socks - 409 с объяснением.
      operationId: createJoin
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Команда установки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JoinCommand' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/join/{token}:
    get:
      summary: Скрипт установки агента (выполняется на новой машине)
      description: |
        bash-скрипт: скачивает бинарь (`/v1/join/{token}/telemux`), меняет токен на токен агента
        (`POST /v1/join/{token}/agent`), пишет /etc/telemux/agent.env, agent.token и юнит
        telemux-agent, запускает агента в режиме compare. Токен не тратится, пока не вызван
        обмен. Просроченный, использованный или неизвестный токен - 404 (без подробностей).
        Доступен на TLS-слушателе агентов и через мост выхода.
      operationId: getJoinScript
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Скрипт
          content:
            text/x-shellscript:
              schema: { type: string }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/join/{token}/telemux:
    get:
      summary: Бинарь telemux для новой машины (linux/amd64)
      description: |
        Бинарь самого мастера. Токен не тратится. Мастер собран не под linux/amd64 - 503.
      operationId: getJoinBinary
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Бинарь
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/join/{token}/agent:
    post:
      summary: Обмен одноразового токена на токен агента
      description: |
        Одноразово - второй вызов 404. Возвращает токен и содержимое agent.env. Только мастер.
        `format=env` - для скрипта без jq: text/plain, первая строка - токен агента, дальше agent.env.
      operationId: exchangeJoin
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: format, in: query, required: false, schema: { type: string, enum: [json, env] } }
      responses:
        '200':
          description: Токен агента
          content:
            application/json:
              schema:
                type: object
                required: [target, agent_token, agent_env]
                properties:
                  target: { type: string }
                  agent_token: { type: string }
                  agent_env: { type: string, description: "Готовое содержимое /etc/telemux/agent.env" }
            text/plain:
              schema: { type: string }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/targets/{code}/resources/{resource}:
    put:
      summary: Готовый ресурс одной машины от бота
      description: |
        Бот публикует ресурс, который собирает сам: `telemt.config` - основной telemt.toml
        машины без WEB-профилей (текст; профили агент собирает из `telemt.users`, машинную
        часть накладывает из `telemt.local.toml` на машине), `mtg.config` и `mtg.secondary.config` - отдельные config.toml
        mtg-multi машины (текст), `xui.clients` - JSON-массив клиентов MTProto-входа
        мастер-панели 3x-ui (машина вида panel). Новая ревизия создаётся только при изменении
        содержимого. `telemt.config` проверяется до публикации: текст разбирается как TOML,
        в нём нет `[[web.vhosts.profiles]]` и есть `include` на users.toml - иначе 400.
        `telemt.users` сюда не публикуется: его собирает telemux. Выключенной машине - 409
        `machine_disabled`. `telemt.config` и `mtg.config` машины, которые собирает сам telemux
        (сервер с `config_source=telemux`, ADR 0006), - 409 `managed_by_telemux`: бот считает
        это пропуском.
      operationId: putTargetResource
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
        - { name: resource, in: path, required: true, schema: { type: string, enum: [telemt.config, mtg.config, mtg.secondary.config, xui.clients] } }
      requestBody:
        required: true
        content:
          text/plain:
            schema: { type: string, maxLength: 4194304 }
      responses:
        '200':
          description: Опубликовано (или не изменилось)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Publish' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/revisions/{rev}/status:
    get:
      summary: Дошла ли ревизия до машин
      description: |
        По каждой машине с ресурсом telemt.users: применено ли состояние не
        старее ревизии `rev`. Бот выдаёт ссылку, когда применили нужные машины.
      operationId: getRevisionStatus
      parameters:
        - name: rev
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Статус по машинам
          content:
            application/json:
              schema:
                type: object
                required: [revision, applied, total, targets]
                properties:
                  revision: { type: integer }
                  applied: { type: integer, description: Сколько машин применили }
                  total: { type: integer }
                  targets:
                    type: array
                    items: { $ref: '#/components/schemas/TargetStatus' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/machines:
    get:
      summary: Машины флота и последний отчёт их агентов
      description: |
        Все машины по коду, включая машины без ресурсов (выходы без telemt и mtg)
        и машины, где агента ещё нет (`seen_at: null`). По каждой - версия агента,
        мост, результат локальных проверок, состояние ресурсов и версии telemt и mtg
        из последнего runtime-отчёта. Фильтры: `resource` - машине назначен ресурс,
        `enabled`, `kind`; `paging.total` считается с фильтром. Неизвестное
        значение фильтра - 400.
      operationId: listMachines
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - { name: resource, in: query, schema: { type: string, enum: [telemt.users, telemt.config, mtg.config, mtg.secondary.config, xui.clients, tls.web, stack] } }
        - { name: enabled, in: query, schema: { type: boolean } }
        - { name: kind, in: query, schema: { type: string, enum: [exit, relay, panel] } }
      responses:
        '200':
          description: Страница машин
          content:
            application/json:
              schema:
                type: object
                required: [data, paging]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Machine' }
                  paging: { $ref: '#/components/schemas/Paging' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/machines/{code}/runtime:
    get:
      summary: Последний runtime-снимок машины
      description: |
        Нагрузка машины, состояние telemt и mtg без списков пользователей.
        `stale: true` - снимок старше порога (по умолчанию три периода отчёта, 180 с)
        или его ещё нет (`seen_at: null`).
        `telemt`/`mtg` - null, если на машине нет продукта или отчёта ещё не было.
      operationId: getMachineRuntime
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Снимок машины
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MachineRuntime' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/connections:
    get:
      summary: Подключения пользователей по последним снимкам машин
      description: |
        Строка на машину, продукт и пользователя. Порядок: machine, product, key.
        В снимок попадают только пользователи с подключениями или адресами.
        Фильтры: `machine`, `product`, `min_connections`, `user` - префикс ключа
        пользователя (символы `%` и `_` ищутся как есть).
      operationId: listConnections
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - { name: machine, in: query, schema: { type: string } }
        - { name: product, in: query, schema: { $ref: '#/components/schemas/Product' } }
        - { name: min_connections, in: query, schema: { type: integer, minimum: 0 } }
        - { name: user, in: query, description: "Префикс ключа пользователя (без шаблонов)", schema: { type: string, maxLength: 128 } }
      responses:
        '200':
          description: Страница подключений
          content:
            application/json:
              schema:
                type: object
                required: [data, paging]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Connection' }
                  paging: { $ref: '#/components/schemas/Paging' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/connections/summary:
    get:
      summary: Сводка подключений по машинам
      description: |
        Строка на машину и продукт, у которых есть runtime-снимок. Порядок machine, product.
        Строка есть и тогда, когда API продукта на машине не ответил: `api_ok: false`,
        причина в `error`, `connections_total` и `users_online` - по последнему удачному
        снимку (или 0). Клиенту в этом случае стоит взять подключения другим путём.
      operationId: getConnectionsSummary
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Страница сводки
          content:
            application/json:
              schema:
                type: object
                required: [data, paging]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ConnectionSummary' }
                  paging: { $ref: '#/components/schemas/Paging' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/connections/by-user:
    get:
      summary: Подключения пользователей по всем машинам
      description: |
        Для каждого `user` (параметр повторяется, от 1 до 100 штук) - сумма подключений
        по последним снимкам всех машин и число машин, где у пользователя есть подключения.
        Ответ - в порядке запроса, дубли схлопываются; пользователь без строк - нули и
        `seen_at: null`. Один запрос к базе на весь список.
      operationId: getConnectionsByUser
      parameters:
        - name: user
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Суммы по пользователям
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/UserConnections' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/overview:
    get:
      summary: Обзор флота для главной страницы панели
      description: |
        Итоги одним запросом: машины (всего, с агентом онлайн - runtime-отчёт свежее порога,
        молчащие - включённые машины без runtime-отчёта дольше 10 минут), подключения и
        уникальные пользователи онлайн по всем машинам, пары с релеем (все включённые машины
        в статусе ok или нет), сертификаты (истекают раньше чем через `cert_warn_days` дней,
        ещё не выпущены; `certs: null` - сертификаты на мастере выключены).
        `data` - машины по коду с runtime-полями, не больше 500 (`truncated: true` - флот
        больше; итоги при этом по всем машинам). Пагинации нет: флот небольшой.
      operationId: getOverview
      responses:
        '200':
          description: Обзор
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Overview' }
        '401': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/log-errors:
    get:
      summary: Ошибки журнала telemt за окно
      description: |
        Суммы счётчиков из runtime-отчётов за периоды, закончившиеся после `since`.
        Мастер хранит счётчики 24 часа: `since` раньше - 400. Порядок: count по
        убыванию, machine, key, kind. Пустой `key` - строка без пользователя.
      operationId: listLogErrors
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - { name: since, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: machine, in: query, schema: { type: string } }
      responses:
        '200':
          description: Страница сумм
          content:
            application/json:
              schema:
                type: object
                required: [data, paging]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/LogErrorSum' }
                  paging: { $ref: '#/components/schemas/Paging' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/pairs:
    get:
      summary: Пары флота - релей и его выходы
      description: |
        Пара - релей (kind=relay) и выходы, у которых relay_code указывает на него.
        Страница идёт по релеям, отсортированным по коду. Выходы без релея и машины
        вида panel попадают в отдельную псевдо-пару с `relay: null` в конце списка
        (её не бывает, если таких машин нет).
      operationId: listPairs
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Страница пар
          content:
            application/json:
              schema:
                type: object
                required: [data, paging]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Pair' }
                  paging: { $ref: '#/components/schemas/Paging' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/drift:
    get:
      summary: Машины, где применённое расходится с желаемым
      description: |
        Строка на (машина, ресурс) с проблемой, которая держится дольше порога:
        - `behind` - применённая ревизия меньше желаемой, `since` - время создания желаемой;
        - `failed` - агент сообщил status=failed (resource - ресурс) или не прошла локальная
          проверка (resource - `check:<имя>`, desired_revision 0); `since` - последняя смена
          состояния в apply_log, без записи - seen_at;
        - `silent` - агент не отчитывался дольше порога (одна строка на машину, resource пустой).
        Машина без агента не silent, но её назначенные ресурсы попадают в `behind` с
        `observed_revision: null`.
        Выключенные машины (enabled=false) не попадают.
      operationId: listDrift
      parameters:
        - { name: threshold, in: query, description: "Порог в секундах", schema: { type: integer, minimum: 0, maximum: 86400, default: 600 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Страница расхождений
          content:
            application/json:
              schema:
                type: object
                required: [data, paging, threshold_seconds]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DriftItem' }
                  paging: { $ref: '#/components/schemas/Paging' }
                  threshold_seconds: { type: integer }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/certs:
    get:
      summary: Сертификаты WEB-доменов релеев
      description: |
        Строка на пару (включённый релей, домен из его `settings.web_domains`), по коду
        машины и домену. Состояние выпуска на мастере: срок сертификата, когда он выпущен,
        последняя попытка и её ошибка. Домен без сертификата - `not_after: null`.
        `assigned` - машине назначен ресурс `tls.web` (сертификаты до неё доходят).
        Сами сертификаты и ключи эта ручка не отдаёт никогда. `machine` - только домены
        этой машины (`paging.total` - с фильтром).
      operationId: listCerts
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - { name: machine, in: query, schema: { type: string } }
      responses:
        '200':
          description: Страница сертификатов
          content:
            application/json:
              schema:
                type: object
                required: [data, paging]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CertInfo' }
                  paging: { $ref: '#/components/schemas/Paging' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/servers:
    get:
      summary: Серверы с точками входа и живыми цифрами
      description: |
        Справочник серверов (ADR 0005): «Сервер N» - движок, релей и машина за рубежом,
        лимиты, настройки движка и точки входа (одна точка входа = одна ссылка). Из описания
        telemux собирает конфиги машин (ADR 0006): `config_source` - кто их публикует,
        `render` - сводка последнего сравнения сборки. По номеру; фильтры `engine`,
        `state`; `paging.total` - с фильтром. `live` - живые цифры машин сервера по
        последнему runtime-отчёту агента (продукт = движок сервера).
      operationId: listServers
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - { name: engine, in: query, schema: { $ref: '#/components/schemas/ServerEngine' } }
        - { name: state, in: query, schema: { $ref: '#/components/schemas/ServerState' } }
      responses:
        '200':
          description: Страница серверов
          content:
            application/json:
              schema:
                type: object
                required: [data, paging]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Server' }
                  paging: { $ref: '#/components/schemas/Paging' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    post:
      summary: Создать сервер
      description: |
        Только мастер. Номер занят - 409. Ошибки ввода - 400 с кодом: `unknown_machine`
        (нет машины или не того вида: `relay_code` - релей, `node_code` - выход),
        `unknown_setting`, `bad_setting` (настройки по каталогу полей), `bad_endpoint`
        (точка входа: вид, хост, порт, `tls_domain` для ee, повтор), `bad_request` (остальное).
      operationId: createServer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServerWrite' }
      responses:
        '201':
          description: Сервер создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Server' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    put:
      summary: Импорт серверов
      description: |
        До 100 серверов (больше - 400 `batch_too_large`), upsert по номеру, одна транзакция:
        любая плохая запись - ничего не меняется. Движок существующего сервера не меняется
        (400 `engine_immutable`). Тот же формат читает `telemux servers import <file.json>`.
      operationId: importServers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 100
              items: { $ref: '#/components/schemas/ServerWrite' }
      responses:
        '200':
          description: Импорт применён
          content:
            application/json:
              schema:
                type: object
                required: [inserted, updated]
                properties:
                  inserted: { type: integer }
                  updated: { type: integer }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/servers/fields:
    get:
      summary: Каталог полей настроек движка
      description: |
        Допустимые ключи `settings` сервера: тип, пределы, значение по умолчанию (пусто -
        по умолчанию движка или бота), группа и способ применения: `instant` - бот и ссылки,
        `reload` - перечитывание без рестарта, `restart` - рестарт сервиса (подключения рвутся),
        `firewall` - правила iptables. `danger` - смена меняет ссылки пользователей; панель
        спрашивает подтверждение. Каталог небольшой и постоянный, без пагинации.
      operationId: listServerFields
      parameters:
        - { name: engine, in: query, schema: { $ref: '#/components/schemas/ServerEngine' } }
      responses:
        '200':
          description: Поля каталога
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ServerField' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/servers/{no}:
    parameters:
      - { name: no, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 99 } }
    get:
      summary: Сервер
      operationId: getServer
      responses:
        '200':
          description: Сервер
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Server' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    put:
      summary: Заменить сервер целиком вместе с точками входа
      description: |
        Одна транзакция. `no` в теле можно не указывать; если указан - должен совпадать с
        путём. Смена движка - 400 `engine_immutable`. Ошибки ввода - как у создания.
      operationId: replaceServer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServerWrite' }
      responses:
        '200':
          description: Сервер заменён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Server' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    delete:
      summary: Удалить выключенный сервер
      description: Только `state=disabled`, иначе 409. Точки входа удаляются вместе с сервером.
      operationId: deleteServer
      responses:
        '204':
          description: Удалён
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/servers/{no}/render:
    parameters:
      - { name: no, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 99 } }
    get:
      summary: Сравнение сборки telemux с конфигами машин сервера
      description: |
        Последний проход цикла сборки на мастере (раз в минуту и сразу после правки сервера
        или пользователей): по каждой машине и ресурсу (`telemt.config`, `mtg.config`, `mtg.secondary.config`) - sha
        кандидата telemux и текущей ревизии, совпадение, ошибка сборки и unified diff
        «текущий → кандидат». Значения в секциях `[secrets]` и `[access.users]` в diff
        заменены на `<secret>` (сменённый ключ - `<secret changed>`). Ошибки - строкой
        `код: текст`: `no_address` (у машины нет `targets.settings.address`), `not_assigned`
        (ресурс не назначен машине или она выключена - кандидат собран, но не публикуется),
        `no_tls_domain`, `bad_setting`, `shared_machine` (ресурс машины собирают несколько
        серверов), `publish_failed`. У сервера не больше двух машин - без пагинации.
      operationId: getServerRender
      responses:
        '200':
          description: Сравнение по машинам
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ServerRenderItem' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/servers/{no}/config-source:
    parameters:
      - { name: no, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 99 } }
    put:
      summary: Кто публикует конфиги машин сервера - бот или telemux
      description: |
        Только мастер. На `telemux` - только если последнее сравнение есть и совпало по всем
        машинам сервера, иначе 409 `render_mismatch`; `force: true` переключает и при
        расхождении. Обратно на `bot` - всегда. При `telemux` цикл сборки сам публикует
        кандидата (ревизия - только при изменении), а публикация этих ресурсов ботом - 409
        `managed_by_telemux`.
      operationId: setServerConfigSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source]
              properties:
                source: { $ref: '#/components/schemas/ConfigSource' }
                force: { type: boolean, default: false }
      responses:
        '200':
          description: Источник сменён (или уже был таким)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Server' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/targets/{code}/apply-log:
    get:
      summary: История применений и проверок машины
      description: Записи apply_log машины, новые первыми. Неизвестная машина - 404.
      operationId: getApplyLog
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Страница журнала
          content:
            application/json:
              schema:
                type: object
                required: [data, paging]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ApplyLogEntry' }
                  paging: { $ref: '#/components/schemas/Paging' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/targets/{code}:
    parameters:
      - { name: code, in: path, required: true, schema: { type: string } }
    put:
      summary: Включить, выключить машину и поправить её настройки
      description: |
        Частичное обновление: `enabled` и (или) `settings`, хотя бы одно. Только мастер.
        `settings` сливаются с текущими: ключ с пустым значением удаляется (можно только
        `web_domains`, адрес релея и `maintenance_until`). Допустимые ключи - по виду машины, проверка - как при
        добавлении: выход - `address` (публичный IPv4), `bridge_socks`
        (`socks5://127.0.0.1:<порт>`); релей - `address` (IP машины) и `web_domains` (домены
        через запятую), `relay_paths_managed` (0 или 1); вход панели - `inbound_id`, `node_id`,
        `port` (целые больше 0) и `node_code`. Чужой или неверный ключ - 400 `bad_setting`,
        неизвестное поле тела - 400.
        Выходы и релеи поддерживают `maintenance_until` - будущий срок RFC3339,
        не дальше 15 минут. До истечения срока мастер сохраняет прежние состояния
        тревог канала управления этой машины; клиентские пробы и ошибки применения
        конфигураций продолжаются. `expected_maintenance_until` задаёт условие
        обновления; пустая строка означает отсутствие действующего окна. Если
        условие не выполнено или новое окно перезаписывает уже открытое без
        условия, возвращается 409 `maintenance_conflict`.
        Выключенной машине не публикуются новые ревизии (публикация ресурса ей - 409
        `machine_disabled`), её нет в тревогах; агент продолжает отчитываться, а
        `/v1/desired` отвечает ему 304. При включении мастер публикует `telemt.users`
        машинам, у которых он устарел; ресурсы бота (`telemt.config`, `mtg.config`) бот
        публикует сам.
      operationId: updateTarget
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TargetPatch' }
      responses:
        '200':
          description: Машина после изменения
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Target' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    delete:
      summary: Удалить выключенную машину
      description: |
        Только мастер. Включённую - 409 `machine_enabled`. На машину ссылаются серверы
        (`relay_code`, `node_code`), выходы релея или входы панели - 409 `machine_in_use`,
        в `message` - номера серверов и коды машин. Удаляются токены агента, желаемое и
        применённое состояние, журнал, runtime и история нагрузки; события тревог остаются.
      operationId: deleteTarget
      responses:
        '204':
          description: Удалена
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/machines/{code}/check:
    post:
      summary: Проверка связи с машиной
      description: |
        Только мастер (проверка идёт с него). Свежесть агента (последний отчёт observed или
        runtime против порога свежести и `silent_after`) и каждая включённая точка входа
        серверов машины (кроме серверов в `state=disabled`): через релей - точки серверов,
        где машина - `relay_code`, напрямую - где `node_code`. TCP-подключение к host:port,
        для `web` - к host:443 и TLS-рукопожатие с SNI=host с проверкой цепочки и имени
        (срок сертификата - `not_after`, `days_left`). Таймаут 5 с на точку, до 8 точек
        параллельно, всего не дольше 20 с: до чего не дошла очередь - ошибка в ответе.
        Ошибки сети - в результате (`ok: false`, `error`), не 5xx. Не больше 200 точек
        (`truncated: true` - были ещё).
      operationId: checkMachine
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Результат проверки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MachineCheck' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/machines/{code}/metrics:
    get:
      summary: История нагрузки машины
      description: |
        Каждый runtime-отчёт агента (раз в минуту) пишет строку истории; хранение 8 дней.
        Значения усредняются по шагу `step` (границы шагов от 2000-01-01 UTC, не от `from`),
        шаги без отчётов не возвращаются. По умолчанию - последние 24 часа с шагом 5m.
        Окно `[from, to)`; `from` не раньше `to` - 400; больше 2000 точек - 400
        `too_many_points`. Неизвестная машина - 404. `rx_bps`, `tx_bps` - бит/с;
        нагрузка `null` - агент за шаг не прислал host.
      operationId: getMachineMetrics
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: step, in: query, schema: { type: string, enum: [1m, 5m, 1h], default: 5m } }
      responses:
        '200':
          description: Точки истории
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MachineMetrics' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/stack:
    get:
      summary: Версии telemt и mtg-multi - последние релизы и машины
      description: |
        Последние релизы GitHub по продуктам (мастер проверяет раз в 6 часов и по
        `POST /api/v1/stack/check`) и состояние машин страницей. Версии сравниваются по ядру
        X.Y.Z, ведущая `v` отбрасывается. Своя сборка (`custom_build`) - версия с суффиксом
        после ядра (`1.15.0-webalias`) или неразборчивая; для неё `update_available` только
        если ядро релиза строго больше. Продукта на машине нет (агент его не присылает) -
        поле продукта `null`. Состояния машин нет на реплике - там `data` пустой.
      operationId: getStack
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Релизы и машины
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StackStatus' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/stack/check:
    post:
      summary: Проверить последние релизы сейчас
      description: |
        Только мастер. Запрашивает последний релиз каждого продукта на GitHub и сохраняет
        результат. Ошибка GitHub по продукту - в его `error`, прошлый результат остаётся
        (не 5xx). Чаще раза в минуту - 429 `too_many_requests`.
      operationId: checkStack
      responses:
        '200':
          description: Релизы после проверки
          content:
            application/json:
              schema:
                type: object
                required: [products]
                properties:
                  products:
                    type: array
                    items: { $ref: '#/components/schemas/StackProduct' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/machines/{code}/update:
    post:
      summary: Обновить telemt или mtg-multi на машине
      description: |
        Только мастер. Мастер скачивает релиз, сверяет SHA256 по контрольной сумме релиза,
        кладёт бинарь в кэш и публикует машине ресурс `stack`. Агент в режиме apply заменяет
        бинарь, перезапускает сервис и проверяет, что он поднялся; не поднялся - возвращает
        прежний. Результат - в `GET /api/v1/stack` (`update.status`) и в ленте тревог
        (`apply_failed`). `version` не задана - последний релиз.

        Ресурс `stack` - разовая команда: в ревизии только обновляемый продукт, а после итога
        (applied, failed, таймаут 30 минут) мастер публикует новую ревизию без него. На машине
        одновременно идёт не больше одного обновления (по любому продукту).

        Ошибки: 400 `unknown_product`, `unknown_version` (нет такого релиза или его версия не
        разбирается); 404 - нет машины; 409 `machine_disabled`, `product_missing` (агент этот
        продукт не присылает), `custom_build` (на машине своя сборка - нужен `force: true`),
        `not_newer` (версия не новее текущей - нужен `force: true`), `update_in_progress`
        (обновление на машине ещё идёт), `asset_missing` (в релизе нет файла под архитектуру
        машины или архитектура не поддерживается); 503 `release_unavailable` (релиз не
        скачался или сумма не сошлась).
      operationId: updateMachineProduct
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StackUpdateRequest' }
      responses:
        '202':
          description: Ревизия опубликована, агент применит её
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StackUpdateState' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/events:
    get:
      summary: Лента тревог по машинам (для бота)
      description: |
        События после `after_id` по возрастанию `id`. Бот запоминает последний `id` и
        пересылает новые админу. Мастер раз в 30 с пишет: `down` - включённая машина с
        агентом молчит дольше `silent_after` (10 мин), `up` - вернулась (по одному событию
        на переход; машина, где агента ещё не ставили, не молчит); `apply_failed` - агент
        сообщил провал применения ревизии ресурса (одно событие на ревизию). Выключенные
        машины в тревогах не участвуют. Хранение - 30 дней. `paging.total` - сколько
        событий после `after_id`, `paging.offset` всегда 0.

        Релей и его свои ноды (выходы с `relay_code` = релей):
        - `down` по релею - только если его агент молчит дольше 10 мин и ни одна своя
          нода не видела его через мост дольше 3 мин; `up` - снова на связи;
        - `relay_silent` (`machine` - релей, `exit` - выход) - выход жив, а релей не
          ходит через его мост дольше 3 мин; `relay_ok` - пара вернулась в `ok` после
          `relay_silent`. Пара, у которой молчит сам выход (`exit_down`), событий не даёт;
        - `foreign_bridge` (`machine` - релей, `exit` - чужой выход) - последний отчёт
          релея пришёл через мост выхода не из его пары;
        - `relay_no_exit` - у релея нет ни одной своей ноды.

        Все события - только на переходе; релеи без агента и выключенные машины
        событий пар не дают.
      operationId: listEvents
      parameters:
        - { name: after_id, in: query, schema: { type: integer, format: int64, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200':
          description: Страница событий
          content:
            application/json:
              schema:
                type: object
                required: [data, paging]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/MachineEvent' }
                  paging: { $ref: '#/components/schemas/Paging' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/stack/blobs/{sha256}:
    get:
      summary: Бинарь обновления для агента
      description: |
        Бинарь из кэша мастера по его SHA256. Токен машины даёт доступ только к бинарям из
        последней ревизии её ресурса `stack`; чужой или неизвестный - 404. Бинаря нет в кэше
        этого узла и узел не мастер - 409 `not_master` (идти к следующему адресу).
      operationId: getStackBlob
      security:
        - agentToken: []
      parameters:
        - { name: sha256, in: path, required: true, schema: { type: string, pattern: '^[0-9a-f]{64}$' } }
        - { name: target, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Бинарь
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/desired:
    get:
      summary: Желаемое состояние машины (long-poll агента)
      description: |
        Ответ сразу, если есть ревизия новее `rev`; иначе запрос ждёт до `wait`
        (максимум 60 с) и возвращает 304. Токен машины даёт доступ только к её бандлу.
        Выключенная машина (`enabled: false`) новых ревизий не получает: запрос ждёт
        до `wait` и возвращает 304; отчёты `/v1/observed` и `/v1/runtime` она шлёт как обычно.
        Включённый релей с `settings.relay_paths_managed=1` получает от лидера
        список путей, если запрошен заголовок `X-Telemux-Accept-Relay-Masters`.
        Формат списка - base64url без padding от JSON с полем `paths`, в каждом
        элементе есть `exit` (код выхода) и `master` (HTTP-адрес и SOCKS через |).
        Пустой список снимает активные пробы. При отсутствии заголовка агент
        сохраняет последний принятый список.
      operationId: getDesired
      security:
        - agentToken: []
      parameters:
        - { name: target, in: query, required: true, schema: { type: string } }
        - { name: rev, in: query, required: true, schema: { type: integer, minimum: 0 } }
        - { name: wait, in: query, schema: { type: string, example: 55s } }
        - { name: X-Telemux-Accept-Relay-Masters, in: header, schema: { type: string, enum: ['1'] } }
      responses:
        '200':
          description: Бандл новее известной агенту ревизии
          headers:
            X-Telemux-Relay-Masters: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bundle' }
        '304':
          description: Новее нет
          headers:
            X-Telemux-Relay-Masters: { schema: { type: string } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/observed:
    post:
      summary: Отчёт агента о состоянии машины
      operationId: postObserved
      security:
        - agentToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ObservedReport' }
      responses:
        '204': { description: Отчёт принят }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/runtime:
    post:
      summary: Runtime-отчёт агента (раз в минуту)
      description: |
        Нагрузка машины, состояние telemt и mtg, подключения пользователей,
        счётчики ошибок журнала. Мастер хранит только последний снимок машины
        (строки пользователей продукта заменяются, только если API продукта
        ответил - `api_ok: true`), счётчики журнала - 24 часа. Повтор того же
        периода журнала не удваивает счётчики.
        Каждый отчёт добавляет строку истории нагрузки машины (минута, 8 дней) -
        `/api/v1/machines/{code}/metrics`.
        Лимиты: до 5000 пользователей в каждом продукте, до 20 адресов на
        пользователя, до 5000 строк журнала - иначе 400; тело больше 2 МБ - 413
        (агент сам урезает отчёт: адреса, затем пользователей с меньшим числом
        подключений, затем журнал - и пишет об этом в `error` продукта).
        Проверки значений (400 с кодом): `host_invalid` - проценты вне 0..100,
        отрицательные или нечисловые значения нагрузки; `log_period_invalid` -
        `period_end` в будущем больше чем на 5 мин, старше часа (+5 мин) или
        период длиннее 65 мин; `log_count_invalid` - счётчик больше 1e9.
        Старый мастер или мост без этой ручки отвечает 404/405 - агент
        увеличивает паузу между попытками до 30 мин.
        Выход с мостом присылает `bridge` - сводку своего моста: какие релеи через
        него ходят (`bridge_invalid` - больше 100 релеев, пустой или повторённый код,
        отрицательный счётчик, `last_seen` в будущем больше чем на 5 мин).
        Пришедший через мост с кодом выхода отчёт релея (заголовок `X-Telemux-Bridge`)
        записывается в `relay_via` машины (только машине вида relay); не код
        существующего выхода - отметка пропускается (WARN в логе мастера), отчёт
        принимается.
      operationId: postRuntime
      security:
        - agentToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuntimeReport' }
      responses:
        '204': { description: Отчёт принят }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    botToken:
      type: http
      scheme: bearer
      description: Токен бота (TELEMUX_BOT_TOKEN)
    agentToken:
      type: http
      scheme: bearer
      description: Токен машины (telemux agent-token)
    session:
      type: apiKey
      in: cookie
      name: telemux_session
  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    UserKey:
      name: key
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Key' }
  responses:
    Error:
      description: Ошибка
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Key:
      type: string
      pattern: '^[a-z0-9_]{1,64}$'
      description: Имя пользователя в telemt; `placeholder` и суффикс `_legacy` зарезервированы
    Secret:
      type: string
      pattern: '^[0-9a-f]{32}$'
    UserBody:
      type: object
      required: [secret]
      properties:
        secret: { $ref: '#/components/schemas/Secret' }
        expires_at: { type: string, format: date-time, nullable: true }
        max_tcp_conns: { type: integer, minimum: 1, nullable: true }
        data_quota_bytes:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: Страховочная квота telemt в байтах. По умолчанию 0. Ноль, null или отсутствие поля снимает квоту.
        previous_secret:
          description: Старый секрет после смены ключа, действует до previous_secret_expires_at
          allOf: [{ $ref: '#/components/schemas/Secret' }]
        previous_secret_expires_at: { type: string, format: date-time, nullable: true }
    User:
      allOf:
        - type: object
          required: [key]
          properties:
            key: { $ref: '#/components/schemas/Key' }
        - $ref: '#/components/schemas/UserBody'
    Publish:
      type: object
      required: [revision, changed]
      properties:
        revision: { type: integer, description: "Последняя ревизия: новая или прежняя, если ничего не изменилось" }
        changed:
          type: array
          description: Машины, получившие новую ревизию
          items: { type: string }
    PointChange:
      allOf:
        - $ref: '#/components/schemas/Publish'
        - type: object
          required: [created]
          properties:
            created: { type: boolean }
    TargetStatus:
      type: object
      required: [code, desired_revision, observed_revision, status, seen_at, applied]
      properties:
        code: { type: string }
        desired_revision: { type: integer }
        observed_revision: { type: integer, nullable: true }
        status:
          type: string
          enum: [applied, failed, pending, compared, unknown]
        seen_at: { type: string, format: date-time, nullable: true }
        applied: { type: boolean }
    Bundle:
      type: object
      required: [target, revision, resources]
      properties:
        target: { type: string }
        revision: { type: integer }
        resources:
          type: array
          items:
            type: object
            required: [resource, revision, sha256, content]
            properties:
              resource: { type: string, example: telemt.users }
              revision: { type: integer }
              sha256: { type: string }
              content: { type: string, format: byte, description: Содержимое файла в base64 }
    ObservedReport:
      type: object
      required: [target, resources]
      properties:
        target: { type: string }
        agent_version: { type: string }
        via: { type: string, description: Через какой мост пришёл отчёт }
        resources:
          type: array
          description: Пусто у машины без ресурсов - отчёт только о самой машине
          maxItems: 50
          items:
            type: object
            required: [resource, revision, status]
            properties:
              resource: { type: string }
              revision: { type: integer, minimum: 0 }
              sha256: { type: string }
              status: { type: string, enum: [applied, failed, pending, compared] }
              error: { type: string, description: "Причина отказа или описание расхождения (в режиме сравнения)" }
        checks:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/ObservedCheck' }
    ObservedCheck:
      type: object
      description: Локальная проверка машины (например, мост на машине-выходе)
      required: [name, ok]
      properties:
        name: { type: string, maxLength: 64, example: bridge }
        ok: { type: boolean }
        error: { type: string, maxLength: 1024 }
    Machine:
      type: object
      required: [code, kind, enabled, resources, seen_at, checks, observed, runtime_seen_at, host,
                 telemt_api_ok, mtg_api_ok, connections, users_online]
      properties:
        code: { type: string }
        kind: { type: string, enum: [exit, relay, panel] }
        relay_code: { type: string, description: "Для выхода - релей, к которому он держит туннель" }
        address: { type: string, nullable: true, description: "Адрес машины (settings.address); null - не задан. По нему внешние системы сопоставляют свои записи с машинами" }
        enabled: { type: boolean }
        maintenance_until:
          type: string
          format: date-time
          description: Срок планового обслуживания канала управления. После истечения срока проверки идут как обычно.
        resources:
          type: array
          items: { type: string }
        agent_version: { type: string }
        via: { type: string }
        seen_at: { type: string, format: date-time, nullable: true, description: "Последний отчёт агента; null - агента нет" }
        checks:
          type: array
          items: { $ref: '#/components/schemas/ObservedCheck' }
        observed:
          type: array
          items:
            type: object
            required: [resource, revision, status, seen_at]
            properties:
              resource: { type: string }
              revision: { type: integer }
              sha256: { type: string, description: "sha256 ресурса, о котором отчитался агент" }
              status: { type: string, enum: [applied, failed, pending, compared] }
              error: { type: string }
              seen_at: { type: string, format: date-time }
              desired_revision:
                type: integer
                nullable: true
                description: Последняя желаемая ревизия этого ресурса для машины; null - не публиковалась
        telemt_version: { type: string, description: Версия telemt из последнего runtime-отчёта }
        mtg_version: { type: string, description: Версия mtg-multi из последнего runtime-отчёта }
        runtime_seen_at: { type: string, format: date-time, nullable: true, description: "Последний runtime-отчёт; null - не было" }
        host:
          allOf: [{ $ref: '#/components/schemas/RuntimeHost' }]
          nullable: true
          description: Нагрузка машины из последнего runtime-отчёта; null - отчёта нет
        telemt_api_ok: { type: boolean, nullable: true, description: "API telemt ответил в последнем отчёте; null - telemt нет или отчёта не было" }
        mtg_api_ok: { type: boolean, nullable: true, description: "API mtg ответил в последнем отчёте; null - mtg нет или отчёта не было" }
        connections: { type: integer, minimum: 0, description: "Подключений по строкам /api/v1/connections этой машины" }
        users_online: { type: integer, minimum: 0, description: "Пользователей с подключениями на этой машине" }
        runtime_status:
          type: string
          enum: [online, stale, degraded, offline]
          description: |
            Сводный runtime-статус (в /api/v1/machines, /api/v1/pairs, /api/v1/overview):
            offline - runtime-отчёта нет или агент молчит дольше 10 минут; stale - отчёт старше
            порога свежести (по умолчанию 180 с); degraded - агент жив, но API telemt или mtg
            не ответил; иначе online.
        relay_via:
          type: string
          nullable: true
          description: Только у релея - через мост какого выхода пришёл последний отчёт агента (заголовок X-Telemux-Bridge); null - не через мост с кодом
        relay_via_at: { type: string, format: date-time, nullable: true, description: Когда записан relay_via }
        foreign_bridge:
          type: boolean
          description: Только у релея - последний relay_via - выход не из его пары (не его своя нода)
    NewTarget:
      type: object
      required: [code, kind, resources]
      properties:
        code: { type: string, pattern: '^[a-z][a-z0-9-]{1,31}$' }
        kind: { type: string, enum: [exit, relay] }
        relay_code: { type: string, description: "Для выхода - его релей" }
        address: { type: string, description: "Публичный IPv4: для выхода обязателен, для релея - по желанию (announce_ip в telemt.config, ADR 0006)" }
        bridge_socks: { type: string, description: "Для выхода - socks-вход на релее к этому выходу, socks5://127.0.0.1:<порт>" }
        resources:
          type: array
          items: { type: string, enum: [telemt.users, mtg.config, mtg.secondary.config] }
    JoinCommand:
      type: object
      required: [target, command, expires_at]
      properties:
        target: { type: string }
        command: { type: string, description: "Одна строка для root на новой машине; пусто - у нового релея ещё нет выходов" }
        expires_at: { type: string, format: date-time }
        firewall: { type: string, enum: [opened, not_configured, failed, not_needed], description: "Открыт ли адрес выхода на мастере" }
    Paging:
      type: object
      required: [total, limit, offset]
      properties:
        total: { type: integer, description: Всего строк с учётом фильтров }
        limit: { type: integer }
        offset: { type: integer }
    Product:
      type: string
      enum: [telemt, mtg]
    RuntimeHost:
      type: object
      required: [cpu_pct, mem_pct, disk_pct, load1, net_rx_mbps, net_tx_mbps, uptime_s]
      properties:
        cpu_pct: { type: number, minimum: 0, maximum: 100, description: "Загрузка CPU между двумя отчётами, %" }
        mem_pct: { type: number, minimum: 0, maximum: 100 }
        disk_pct: { type: number, minimum: 0, maximum: 100, description: "Занято на корневой ФС, %" }
        load1: { type: number, minimum: 0 }
        net_rx_mbps: { type: number, minimum: 0, maximum: 1000000, description: "Интерфейс маршрута по умолчанию, между отчётами" }
        net_tx_mbps: { type: number, minimum: 0, maximum: 1000000 }
        uptime_s: { type: integer, minimum: 0 }
    RuntimeUser:
      type: object
      required: [key, connections]
      properties:
        key: { type: string, maxLength: 128 }
        connections: { type: integer, minimum: 0 }
        active_ips:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 64 }
        bytes_in: { type: integer, minimum: 0, description: Только mtg }
        bytes_out: { type: integer, minimum: 0, description: Только mtg }
        last_seen: { type: string, format: date-time, nullable: true, description: Только mtg }
    RuntimeTelemt:
      type: object
      required: [version, api_ok, error, users_configured, users_effective, connections_total]
      properties:
        version: { type: string, description: "`telemt --version`; пусто - бинарь не найден" }
        api_ok: { type: boolean, description: "API telemt ответил; false - причина в error" }
        error: { type: string, maxLength: 1024 }
        users_configured: { type: integer, description: Пользователей в telemt без placeholder }
        users_effective: { type: integer, description: Из них не истёкших по users.toml }
        connections_total: { type: integer }
        config_sha256: { type: string, description: sha256 telemt.toml }
        keepalive: { type: integer }
        ack: { type: integer }
        tls_domain: { type: string }
        max_tcp_conns_median: { type: integer, description: Медиана лимитов подключений в users.toml }
        users:
          type: array
          description: Только в отчёте агента; в ответах мастера не отдаётся
          maxItems: 5000
          items: { $ref: '#/components/schemas/RuntimeUser' }
    RuntimeMtg:
      type: object
      required: [version, api_ok, error, connections_total]
      properties:
        version: { type: string }
        api_ok: { type: boolean }
        error: { type: string, maxLength: 1024 }
        connections_total: { type: integer }
        users:
          type: array
          description: Только в отчёте агента; в ответах мастера не отдаётся
          maxItems: 5000
          items: { $ref: '#/components/schemas/RuntimeUser' }
    LogErrorKind:
      type: string
      enum: [limit, handshake, auth, timeout, other]
    BridgeRelay:
      type: object
      required: [code, last_seen, requests, master_ok, last_error]
      properties:
        code: { type: string, maxLength: 64, description: Код релея (из ответа мастера на /v1/desired) }
        last_seen: { type: string, format: date-time, nullable: true, description: Последний запрос релея через мост (часы выхода) }
        requests: { type: integer, minimum: 0, description: "Запросов релея через мост с запуска моста (релей, молчавший 24 ч, забывается и считается заново)" }
        master_ok: { type: boolean, description: Ответил ли мастер на последний запрос релея }
        last_error:
          type: string
          description: |
            Последняя ошибка мастера - класс без адресов и query (например «мастер не ответил: таймаут»,
            «мастер ответил сбоем: HTTP 502»); пусто - ошибок не было
    BridgeSummary:
      type: object
      description: |
        Сводка моста выхода (GET /v1/relays на loopback моста) в runtime-отчёте выхода.
        error - мост не ответил агенту за 3 с или ответил не по контракту, relays тогда пустой.
      required: [code, relays, error]
      properties:
        code: { type: string, description: Код выхода (TELEMUX_BRIDGE_CODE) }
        relays:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/BridgeRelay' }
        error: { type: string, maxLength: 1024 }
    RuntimeReport:
      type: object
      required: [target]
      properties:
        target: { type: string }
        agent_version: { type: string }
        bridge:
          allOf: [{ $ref: '#/components/schemas/BridgeSummary' }]
          description: Только у выхода с мостом (агенту задан TELEMUX_AGENT_BRIDGE_URL); у остальных поля нет
        host:
          allOf: [{ $ref: '#/components/schemas/RuntimeHost' }]
          nullable: true
        telemt:
          allOf: [{ $ref: '#/components/schemas/RuntimeTelemt' }]
          nullable: true
          description: null - на машине нет telemt
        mtg:
          allOf: [{ $ref: '#/components/schemas/RuntimeMtg' }]
          nullable: true
          description: null - на машине нет mtg
        log_errors:
          type: object
          nullable: true
          description: Счётчики журнала telemt за период с прошлого отчёта; null - нет telemt или журнал не прочитан
          required: [period_start, period_end, items]
          properties:
            period_start: { type: string, format: date-time }
            period_end:
              type: string
              format: date-time
              description: "Не позже now+5 мин и не раньше now-1 ч-5 мин; период не длиннее 65 мин"
            items:
              type: array
              maxItems: 5000
              items:
                type: object
                required: [key, kind, count]
                properties:
                  key: { type: string, maxLength: 128, description: "user=<key> из строки; пусто - без пользователя" }
                  kind: { $ref: '#/components/schemas/LogErrorKind' }
                  count: { type: integer, minimum: 0, maximum: 1000000000 }
    MachineRuntime:
      type: object
      required: [code, seen_at, stale, agent_version, host, telemt, mtg]
      properties:
        code: { type: string }
        seen_at: { type: string, format: date-time, nullable: true }
        stale: { type: boolean, description: "Снимок старше порога (по умолчанию 180 с) или его нет" }
        agent_version: { type: string }
        host:
          allOf: [{ $ref: '#/components/schemas/RuntimeHost' }]
          nullable: true
        telemt:
          allOf: [{ $ref: '#/components/schemas/RuntimeTelemt' }]
          nullable: true
        mtg:
          allOf: [{ $ref: '#/components/schemas/RuntimeMtg' }]
          nullable: true
    Connection:
      type: object
      required: [machine, product, key, connections, active_ips, bytes_in, bytes_out, last_seen, seen_at, stale]
      properties:
        machine: { type: string }
        product: { $ref: '#/components/schemas/Product' }
        key: { type: string }
        connections: { type: integer }
        active_ips:
          type: array
          items: { type: string }
        bytes_in: { type: integer, description: "Только mtg, у telemt 0" }
        bytes_out: { type: integer }
        last_seen: { type: string, format: date-time, nullable: true }
        seen_at: { type: string, format: date-time, description: Когда пришёл снимок }
        stale: { type: boolean, description: "Строка старше порога (по умолчанию 180 с): API продукта давно не отвечал или агент молчит" }
    ConnectionSummary:
      type: object
      required: [machine, product, connections_total, users_online, seen_at, stale, api_ok]
      properties:
        machine: { type: string }
        product: { $ref: '#/components/schemas/Product' }
        connections_total: { type: integer, description: "При api_ok=false - сумма по последнему удачному снимку (или 0)" }
        users_online: { type: integer, description: "Пользователей с подключениями; при api_ok=false - по последнему удачному снимку" }
        seen_at: { type: string, format: date-time, description: Когда пришёл последний снимок машины }
        stale: { type: boolean }
        api_ok: { type: boolean, description: "API продукта ответил в последнем снимке; false - причина в error" }
        error: { type: string, description: "Ошибка продукта из последнего снимка; нет поля - ошибок не было" }
    UserConnections:
      type: object
      required: [key, connections, machines, online, seen_at]
      properties:
        key: { type: string }
        connections: { type: integer, minimum: 0, description: Сумма подключений по всем машинам }
        machines: { type: integer, minimum: 0, description: "Машин, где у пользователя есть подключения" }
        online: { type: boolean, description: "connections > 0" }
        seen_at: { type: string, format: date-time, nullable: true, description: "Самый свежий снимок с этим пользователем; null - строк нет" }
    Overview:
      type: object
      required: [machines, connections, pairs, certs, cert_warn_days, stale_after_seconds, silent_after_seconds, data, truncated]
      properties:
        machines:
          type: object
          required: [total, online, silent]
          properties:
            total: { type: integer }
            online: { type: integer, description: "Runtime-отчёт свежее порога (агент жив)" }
            silent: { type: integer, description: "Включённые машины без runtime-отчёта дольше 10 минут или вовсе без него" }
        connections:
          type: object
          required: [total, users_online]
          properties:
            total: { type: integer, description: Подключений по всем машинам }
            users_online: { type: integer, description: Уникальных пользователей с подключениями }
        pairs:
          type: object
          required: [total, ok, problem]
          properties:
            total: { type: integer, description: "Пар с релеем (псевдо-пара «без релея» не считается)" }
            ok: { type: integer }
            problem: { type: integer, description: "Хоть одна включённая машина пары не в статусе ok" }
        certs:
          type: object
          nullable: true
          required: [total, expiring, missing]
          properties:
            total: { type: integer }
            expiring: { type: integer, description: "Сертификат кончается раньше чем через cert_warn_days дней (или уже истёк)" }
            missing: { type: integer, description: Сертификата ещё нет }
        cert_warn_days: { type: integer, example: 14 }
        stale_after_seconds: { type: integer, description: Порог свежести runtime-отчёта }
        silent_after_seconds: { type: integer, description: "Порог «агент молчит» (offline)" }
        data:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/Machine' }
        truncated: { type: boolean, description: "Машин больше 500, в data - первые 500 по коду" }
    LogErrorSum:
      type: object
      required: [machine, key, kind, count]
      properties:
        machine: { type: string }
        key: { type: string }
        kind: { $ref: '#/components/schemas/LogErrorKind' }
        count: { type: integer }
    PairMachine:
      description: Машина в паре - то же, что Machine, плюс желаемая ревизия по ресурсам и сводный статус.
      allOf:
        - $ref: '#/components/schemas/Machine'
        - type: object
          required: [status, desired]
          properties:
            status:
              type: string
              enum: [ok, behind, failed, silent, no_agent, disabled]
              description: |
                disabled - enabled=false; no_agent - агент ни разу не отчитывался; silent - отчёт
                старше 10 минут; failed - хоть один ресурс failed или проверка не пройдена;
                behind - хоть один ресурс отстаёт от желаемой ревизии; иначе ok.
            desired:
              type: array
              items:
                type: object
                required: [resource, revision]
                properties:
                  resource: { type: string }
                  revision: { type: integer }
            relay_status:
              type: string
              enum: [ok, relay_silent, exit_down]
              description: |
                Только у выхода в паре с релеем (своя нода релея). exit_down - агент выхода
                молчит дольше 10 мин (о релее пара ничего не утверждает); ok - выход жив, и
                релей ходил через его мост не позже 3 мин назад (по сводке моста из
                runtime-отчёта выхода не старше 10 мин или по relay_via_at релея);
                relay_silent - выход жив, релей через его мост молчит дольше. Выключенный
                выход в расчёте relay_down не участвует.
            relay_last_seen:
              type: string
              format: date-time
              nullable: true
              description: Только у выхода в паре с релеем - когда релей последний раз ходил через его мост; null - не ходил
    Pair:
      type: object
      required: [relay, exits]
      properties:
        relay_down:
          type: boolean
          description: Релей упал - его агент молчит дольше 10 мин и ни одна своя нода не видела его через мост дольше 3 мин
        foreign_bridge: { type: boolean, description: Последний отчёт релея пришёл через мост чужого выхода }
        status:
          type: string
          enum: [ok, down, no_exit]
          description: "Статус пары: no_exit - у релея нет своих нод, down - relay_down, иначе ok. У псевдо-пары «без релея» поля нет"
        relay:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/PairMachine' }]
          description: null - псевдо-пара «без релея» (выходы без relay_code и машины panel)
        exits:
          type: array
          items: { $ref: '#/components/schemas/PairMachine' }
    DriftItem:
      type: object
      required: [target, kind, reason, resource, desired_revision, since]
      properties:
        target: { type: string }
        kind: { type: string, enum: [exit, relay, panel] }
        relay_code: { type: string }
        reason: { type: string, enum: [behind, failed, silent] }
        resource: { type: string, description: "Пусто для silent" }
        desired_revision: { type: integer, description: "0 для silent" }
        observed_revision: { type: integer, nullable: true }
        since: { type: string, format: date-time }
        seen_at: { type: string, format: date-time, nullable: true }
        error: { type: string }
    CertInfo:
      type: object
      required: [machine, domain, assigned, not_after, issued_at, last_try_at]
      properties:
        machine: { type: string, description: "Код релея" }
        domain: { type: string }
        assigned: { type: boolean, description: "Машине назначен ресурс tls.web" }
        not_after: { type: string, format: date-time, nullable: true, description: "Конец срока; null - сертификата ещё нет" }
        issued_at: { type: string, format: date-time, nullable: true }
        last_try_at: { type: string, format: date-time, nullable: true, description: "Последняя попытка выпуска (удачная или нет)" }
        last_error: { type: string, description: "Ошибка последней попытки; нет поля - последняя удалась" }
    ApplyLogEntry:
      type: object
      required: [at, resource, status]
      properties:
        at: { type: string, format: date-time }
        resource: { type: string, description: "Ресурс или check:<имя> для локальной проверки" }
        revision: { type: integer, nullable: true }
        status: { type: string }
        error: { type: string }
    ServerEngine:
      type: string
      enum: [telemt, mtg]
    ServerState:
      type: string
      enum: [active, maintenance, test, disabled]
      description: |
        `maintenance` - клиент видит «на профилактике» без ссылки; `test` - скрыт от
        клиентов; `disabled` - выключен везде
    EndpointProtocol:
      type: string
      enum: [ee, dd, web]
    Endpoint:
      type: object
      required: [id, protocol, host, port, tls_domain, via_relay, label, sort_order, enabled, note]
      properties:
        id: { type: integer }
        protocol: { $ref: '#/components/schemas/EndpointProtocol' }
        host: { type: string, description: "Домен или IP в ссылке" }
        port: { type: integer, minimum: 1, maximum: 65535, description: "Для web не используется" }
        tls_domain: { type: string, description: "Домен в ee-секрете" }
        via_relay: { type: boolean }
        label: { type: string, description: "Подпись кнопки; пусто - по виду" }
        sort_order: { type: integer }
        enabled: { type: boolean }
        note: { type: string }
    EndpointWrite:
      type: object
      required: [protocol, host]
      properties:
        protocol: { $ref: '#/components/schemas/EndpointProtocol' }
        host: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535, default: 443 }
        tls_domain: { type: string, description: "Обязателен для ee" }
        via_relay: { type: boolean, default: true }
        label: { type: string, maxLength: 64 }
        sort_order: { type: integer, minimum: 0, default: 100 }
        enabled: { type: boolean, default: true }
        note: { type: string, maxLength: 1000 }
    ServerLiveMachine:
      type: object
      required: [code, seen_at, stale, api_ok, connections, users_online]
      properties:
        code: { type: string }
        seen_at: { type: string, format: date-time, nullable: true, description: "Последний runtime-отчёт; null - агента нет" }
        stale: { type: boolean, description: "Отчёт устарел или его нет" }
        api_ok: { type: boolean, description: "API движка на машине ответил" }
        connections: { type: integer }
        users_online: { type: integer }
    ServerLive:
      type: object
      required: [relay, node]
      properties:
        relay:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/ServerLiveMachine' }]
        node:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/ServerLiveMachine' }]
    ServerWrite:
      type: object
      required: [name, engine]
      properties:
        no: { type: integer, minimum: 1, maximum: 99, description: "Обязателен при создании и импорте" }
        name: { type: string, minLength: 1, maxLength: 64, description: "Страна для клиента" }
        emoji: { type: string, maxLength: 16 }
        country: { type: string, pattern: '^([a-z]{2})?$' }
        engine: { $ref: '#/components/schemas/ServerEngine' }
        relay_code: { type: string, nullable: true, description: "Релей в РФ (машина вида relay)" }
        node_code: { type: string, nullable: true, description: "Машина за рубежом (вида exit)" }
        state: { $ref: '#/components/schemas/ServerState' }
        relay_only: { type: boolean, description: "Прямые ссылки скрыты" }
        node_retired: { type: boolean, description: "Машины за рубежом нет, релей и ссылки остаются" }
        tls_domain: { type: string, description: "Основной домен маскировки (ee)" }
        extra_tls_domains:
          type: array
          maxItems: 200
          items: { type: string }
        user_max_tcp_conns: { type: integer, minimum: 1, nullable: true, description: "null - общий по умолчанию" }
        user_max_unique_ips: { type: integer, minimum: 1, nullable: true, description: "null - без лимита" }
        settings:
          type: object
          additionalProperties: { type: string }
          description: Настройки движка по каталогу полей (GET /api/v1/servers/fields)
        note: { type: string, maxLength: 1000 }
        endpoints:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/EndpointWrite' }
    Server:
      type: object
      required: [no, name, emoji, country, engine, relay_code, node_code, state, relay_only, node_retired,
                 tls_domain, extra_tls_domains, user_max_tcp_conns, user_max_unique_ips, settings, note,
                 endpoints, config_source, created_at, updated_at]
      properties:
        no: { type: integer }
        name: { type: string }
        emoji: { type: string }
        country: { type: string }
        engine: { $ref: '#/components/schemas/ServerEngine' }
        relay_code: { type: string, nullable: true }
        node_code: { type: string, nullable: true }
        state: { $ref: '#/components/schemas/ServerState' }
        relay_only: { type: boolean }
        node_retired: { type: boolean }
        tls_domain: { type: string }
        extra_tls_domains:
          type: array
          items: { type: string }
        user_max_tcp_conns: { type: integer, nullable: true }
        user_max_unique_ips: { type: integer, nullable: true }
        settings:
          type: object
          additionalProperties: { type: string }
        note: { type: string }
        endpoints:
          type: array
          items: { $ref: '#/components/schemas/Endpoint' }
        config_source: { $ref: '#/components/schemas/ConfigSource' }
        render: { $ref: '#/components/schemas/ServerRenderSummary' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        live: { $ref: '#/components/schemas/ServerLive' }
    ConfigSource:
      type: string
      enum: [bot, telemux]
      description: |
        Кто публикует конфиги движков машин сервера: `bot` (по умолчанию) или
        сам telemux (ADR 0006). Меняется только `PUT /api/v1/servers/{no}/config-source`.
    ServerRenderSummary:
      type: object
      required: [rows, equal, errors, rendered_at]
      properties:
        rows: { type: integer, description: "Ресурсов машин в сравнении" }
        equal: { type: boolean, description: "Все собраны и совпали с текущими (и есть хоть один)" }
        errors: { type: integer, description: "Не собрались или не назначены" }
        rendered_at: { type: string, format: date-time, nullable: true, description: "null - сравнения ещё не было" }
    ServerRenderItem:
      type: object
      required: [target, resource, candidate_sha, current_sha, equal, error, rendered_at, diff]
      properties:
        target: { type: string, description: "Код машины" }
        resource: { type: string, enum: [telemt.config, mtg.config, mtg.secondary.config] }
        candidate_sha: { type: string, nullable: true, description: "null - кандидат не собран" }
        current_sha: { type: string, nullable: true, description: "null - ревизий ресурса у машины нет" }
        equal: { type: boolean }
        error: { type: string, nullable: true, description: "`код: текст`; null - собран и назначен" }
        rendered_at: { type: string, format: date-time }
        diff: { type: string, description: "Unified diff текущий → кандидат, секреты замаскированы; пусто - совпадает или кандидата нет" }
    ServerField:
      type: object
      required: [key, engine, group, type, default, apply, danger, title_ru, title_en, hint_ru, hint_en]
      properties:
        key: { type: string }
        engine: { $ref: '#/components/schemas/ServerEngine' }
        group: { type: string }
        type: { type: string, enum: [int, bool, string, enum, hostport, host, duration] }
        default: { type: string, description: "Пусто - значение движка или бота по умолчанию" }
        min: { type: integer }
        max: { type: integer }
        enum:
          type: array
          items: { type: string }
        apply: { type: string, enum: [instant, reload, restart, firewall] }
        danger: { type: boolean }
        title_ru: { type: string }
        title_en: { type: string }
        hint_ru: { type: string }
        hint_en: { type: string }
    TargetPatch:
      type: object
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        settings:
          type: object
          maxProperties: 32
          additionalProperties: { type: string, maxLength: 4096 }
          description: Сливаются с текущими; пустое значение удаляет web_domains, адрес релея или maintenance_until.
        expected_maintenance_until:
          type: string
          description: Условие обновления settings.maintenance_until. Срок RFC3339 или пустая строка, если активного окна нет.
    Target:
      type: object
      required: [code, kind, resources, enabled]
      properties:
        code: { type: string }
        kind: { type: string, enum: [exit, relay, panel] }
        relay_code: { type: string }
        resources:
          type: array
          items: { type: string }
        enabled: { type: boolean }
        settings:
          type: object
          additionalProperties: { type: string }
    ProbeResult:
      type: object
      required: [ok, ms]
      properties:
        ok: { type: boolean }
        ms: { type: integer, description: Сколько заняла проверка }
        error: { type: string }
    TLSProbeResult:
      type: object
      required: [ok, ms, not_after, days_left]
      properties:
        ok: { type: boolean }
        ms: { type: integer }
        error: { type: string }
        not_after: { type: string, format: date-time, nullable: true }
        days_left: { type: integer, nullable: true }
    EndpointCheck:
      type: object
      required: [server_no, server_name, endpoint_id, protocol, host, port, via_relay, tcp, tls]
      properties:
        server_no: { type: integer }
        server_name: { type: string }
        endpoint_id: { type: integer, format: int64 }
        protocol: { $ref: '#/components/schemas/EndpointProtocol' }
        host: { type: string }
        port: { type: integer, description: "Для web - 443" }
        via_relay: { type: boolean }
        tcp: { $ref: '#/components/schemas/ProbeResult' }
        tls:
          allOf: [{ $ref: '#/components/schemas/TLSProbeResult' }]
          nullable: true
          description: Только у web
    MachineCheck:
      type: object
      required: [code, kind, enabled, checked_at, ok, agent, endpoints, truncated]
      properties:
        code: { type: string }
        kind: { type: string, enum: [exit, relay, panel] }
        enabled: { type: boolean }
        checked_at: { type: string, format: date-time }
        ok: { type: boolean, description: "Агент свежий и все точки входа ответили" }
        agent:
          type: object
          required: [seen_at, age_seconds, fresh, silent, stale_after_seconds, silent_after_seconds]
          properties:
            seen_at: { type: string, format: date-time, nullable: true }
            age_seconds: { type: integer, nullable: true }
            fresh: { type: boolean, description: "Отчёт не старше порога свежести" }
            silent: { type: boolean, description: "Молчит дольше silent_after или не отчитывался" }
            stale_after_seconds: { type: integer }
            silent_after_seconds: { type: integer }
        endpoints:
          type: array
          items: { $ref: '#/components/schemas/EndpointCheck' }
        truncated: { type: boolean }
    MetricPoint:
      type: object
      required: [at, cpu, mem, disk, load1, rx_bps, tx_bps, connections, users_online]
      properties:
        at: { type: string, format: date-time, description: Начало шага }
        cpu: { type: number, nullable: true }
        mem: { type: number, nullable: true }
        disk: { type: number, nullable: true }
        load1: { type: number, nullable: true }
        rx_bps: { type: number, nullable: true }
        tx_bps: { type: number, nullable: true }
        connections: { type: number }
        users_online: { type: number }
    MachineMetrics:
      type: object
      required: [code, from, to, step, data]
      properties:
        code: { type: string }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        step: { type: string, enum: [1m, 5m, 1h] }
        data:
          type: array
          items: { $ref: '#/components/schemas/MetricPoint' }
    MachineEvent:
      type: object
      required: [id, at, machine, kind, detail]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        machine: { type: string, description: "Машина; у событий пары - релей" }
        kind: { type: string, enum: [down, up, apply_failed, relay_silent, relay_ok, foreign_bridge, relay_no_exit] }
        detail: { type: string }
        exit: { type: string, description: "Только у relay_silent, relay_ok, foreign_bridge - выход пары (или чужой выход)" }
    StackProduct:
      type: object
      required: [product, repo, latest, checked_at, error]
      properties:
        product: { $ref: '#/components/schemas/Product' }
        repo: { type: string, example: telemt/telemt }
        latest:
          nullable: true
          description: Последний релиз; null - ещё ни разу не узнали
          type: object
          required: [version, tag, published_at]
          properties:
            version: { type: string, example: 3.5.17 }
            tag: { type: string, example: 3.5.17 }
            published_at: { type: string, format: date-time }
        checked_at: { type: string, format: date-time, nullable: true }
        error: { type: string, nullable: true, description: Ошибка последней проверки; прошлый latest остаётся }
    StackProductState:
      type: object
      required: [current, latest, update_available, custom_build, update]
      properties:
        current: { type: string, nullable: true, description: "Версия из runtime-отчёта; null - агент её не прислал" }
        latest: { type: string, nullable: true }
        update_available: { type: boolean }
        custom_build: { type: boolean, description: "Своя сборка: суффикс после X.Y.Z или версия не разобрана" }
        update:
          allOf: [ { $ref: '#/components/schemas/StackUpdateState' } ]
          nullable: true
          description: Последнее обновление через telemux; null - не было
    StackMachine:
      type: object
      required: [code, kind, enabled, telemt, mtg]
      properties:
        code: { type: string }
        kind: { type: string, enum: [relay, exit] }
        enabled: { type: boolean }
        telemt:
          allOf: [ { $ref: '#/components/schemas/StackProductState' } ]
          nullable: true
        mtg:
          allOf: [ { $ref: '#/components/schemas/StackProductState' } ]
          nullable: true
    StackStatus:
      type: object
      required: [products, data, paging]
      properties:
        products:
          type: array
          items: { $ref: '#/components/schemas/StackProduct' }
        data:
          type: array
          items: { $ref: '#/components/schemas/StackMachine' }
        paging: { $ref: '#/components/schemas/Paging' }
    StackUpdateRequest:
      type: object
      required: [product]
      additionalProperties: false
      properties:
        product: { $ref: '#/components/schemas/Product' }
        version: { type: string, description: "Версия релиза; по умолчанию последний" }
        force: { type: boolean, default: false, description: "Обновить свою сборку или поставить не более новую версию" }
    StackUpdateState:
      type: object
      required: [code, product, from, to, revision, status, error, requested_at, finished_at]
      properties:
        code: { type: string }
        product: { $ref: '#/components/schemas/Product' }
        from: { type: string, nullable: true, description: Версия на машине в момент запроса }
        to: { type: string }
        revision: { type: integer, description: Ревизия ресурса stack }
        status: { type: string, enum: [pending, applied, failed] }
        error: { type: string, nullable: true }
        requested_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Машинный код
          enum: [bad_request, unauthorized, forbidden, not_found, conflict, gone, unprocessable,
                 not_implemented, unavailable, internal, not_master, mass_delete_guard,
                 payload_too_large, unknown_machine, engine_immutable, unknown_setting,
                 bad_setting, bad_endpoint, batch_too_large, machine_enabled, machine_in_use,
                 machine_disabled, too_many_points, render_mismatch, managed_by_telemux,
                 too_many_requests, unknown_product, unknown_version, product_missing,
                 custom_build, not_newer, update_in_progress, release_unavailable,
                 asset_missing, bridge_invalid]
        message: { type: string }
        error: { type: string, description: Копия message для старой панели }
