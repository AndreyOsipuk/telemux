openapi: 3.0.3
info:
  title: telemux API
  version: "1"
  description: |
    Единый источник правды для HTTP-API telemux: бэкенд проверяется по этой
    спеке в тестах, панель генерирует из неё типы.

    Ошибки - в формате `Error`. 4xx - ошибка запроса, 503 - недоступна база или
    мастер, 500 - баг. Запись принимает только мастер: на остальных узлах -
    409 с кодом `not_master` и заголовком `X-Telemux-Master`.
servers:
  - url: /
security:
  - botToken: []
  - session: []
paths:
  /api/v1/users:
    put:
      summary: Полный набор пользователей от бота
      description: |
        Сверка: пользователи из набора создаются или обновляются, отсутствующие
        удаляются. Затем публикуется ревизия желаемого состояния машин.
        Защита от массового удаления: пустой набор или удаление больше 20% при
        10+ пользователях - 409 `mass_delete_guard`, пока не передан `force=true`.
      operationId: putUsers
      parameters:
        - name: force
          in: query
          schema: { type: boolean }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [users]
              properties:
                users:
                  type: array
                  maxItems: 50000
                  items: { $ref: '#/components/schemas/User' }
      responses:
        '200':
          description: Набор применён, ревизия опубликована
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Publish'
                  - type: object
                    required: [inserted, updated, deleted]
                    properties:
                      inserted: { type: integer }
                      updated: { type: integer }
                      deleted: { type: integer }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/users/{key}:
    parameters:
      - $ref: '#/components/parameters/UserKey'
    put:
      summary: Создать или изменить одного пользователя
      operationId: putUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserBody' }
      responses:
        '200':
          description: Пользователь изменён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PointChange' }
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PointChange' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    delete:
      summary: Удалить пользователя
      operationId: deleteUser
      responses:
        '200':
          description: Удалён, ревизия опубликована
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Publish' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/targets:
    post:
      summary: Добавить машину (кнопка «Добавить машину» в панели)
      description: |
        Заводит машину и сразу выдаёт одноразовую команду установки агента (как POST .../join).
        Только мастер. Код - `^[a-z][a-z0-9-]{1,31}$`, занятый код - 409. Для выхода (`exit`)
        обязательны `relay_code` (существующий релей), `address` (публичный IPv4 выхода) и
        `bridge_socks` (адрес socks-входа на релее, через который релей ходит в этот выход,
        например `socks5://127.0.0.1:10872`). Ресурсы - из `telemt.users`, `mtg.config`.
        Если на мастере настроена цепочка файрвола (`TELEMUX_AGENT_FW_CHAIN`), адрес выхода
        сразу открывается на TLS-порту агентов.
        Новый релей ходит к мастеру через мост своего выхода, а выходов у него ещё нет: машина
        заводится, `command` пустая, токен не выпускается - добавьте выход и вызовите POST .../join.
        Не задан `TELEMUX_AGENT_PUBLIC_URL` или нет сертификата API агентов - 409 до создания машины.
      operationId: createTarget
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewTarget' }
      responses:
        '201':
          description: Машина заведена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JoinCommand' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/targets/{code}/join:
    post:
      summary: Новая одноразовая команда установки агента
      description: |
        Выдаёт свежий одноразовый токен (живёт 1 час) и команду для новой машины. Прежний
        неиспользованный токен этой машины сгорает. Только мастер. Неизвестная машина - 404.
        Выход идёт на мастер напрямую по TLS с проверкой ключа сертификата (`--pinnedpubkey`);
        релей - через мост первого своего выхода (`-x <bridge_socks> http://<address выхода>:18480`).
        Релей без выходов с адресом и socks - 409 с объяснением.
      operationId: createJoin
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Команда установки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JoinCommand' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/join/{token}:
    get:
      summary: Скрипт установки агента (выполняется на новой машине)
      description: |
        bash-скрипт: скачивает бинарь (`/v1/join/{token}/telemux`), меняет токен на токен агента
        (`POST /v1/join/{token}/agent`), пишет /etc/telemux/agent.env, agent.token и юнит
        telemux-agent, запускает агента в режиме compare. Токен не тратится, пока не вызван
        обмен. Просроченный, использованный или неизвестный токен - 404 (без подробностей).
        Доступен на TLS-слушателе агентов и через мост выхода.
      operationId: getJoinScript
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Скрипт
          content:
            text/x-shellscript:
              schema: { type: string }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/join/{token}/telemux:
    get:
      summary: Бинарь telemux для новой машины (linux/amd64)
      description: |
        Бинарь самого мастера. Токен не тратится. Мастер собран не под linux/amd64 - 503.
      operationId: getJoinBinary
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Бинарь
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/join/{token}/agent:
    post:
      summary: Обмен одноразового токена на токен агента
      description: |
        Одноразово - второй вызов 404. Возвращает токен и содержимое agent.env. Только мастер.
        `format=env` - для скрипта без jq: text/plain, первая строка - токен агента, дальше agent.env.
      operationId: exchangeJoin
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: format, in: query, required: false, schema: { type: string, enum: [json, env] } }
      responses:
        '200':
          description: Токен агента
          content:
            application/json:
              schema:
                type: object
                required: [target, agent_token, agent_env]
                properties:
                  target: { type: string }
                  agent_token: { type: string }
                  agent_env: { type: string, description: "Готовое содержимое /etc/telemux/agent.env" }
            text/plain:
              schema: { type: string }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/targets/{code}/resources/{resource}:
    put:
      summary: Готовый ресурс одной машины от бота
      description: |
        Бот публикует ресурс, который собирает сам: `mtg.config` - config.toml
        mtg-multi машины (текст), `xui.clients` - JSON-массив клиентов MTProto-входа
        мастер-панели 3x-ui (машина вида panel). Новая ревизия создаётся только при изменении
        содержимого. `telemt.users` сюда не публикуется: его собирает telemux.
      operationId: putTargetResource
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
        - { name: resource, in: path, required: true, schema: { type: string, enum: [mtg.config, xui.clients] } }
      requestBody:
        required: true
        content:
          text/plain:
            schema: { type: string, maxLength: 4194304 }
      responses:
        '200':
          description: Опубликовано (или не изменилось)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Publish' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/revisions/{rev}/status:
    get:
      summary: Дошла ли ревизия до машин
      description: |
        По каждой машине с ресурсом telemt.users: применено ли состояние не
        старее ревизии `rev`. Бот выдаёт ссылку, когда применили нужные машины.
      operationId: getRevisionStatus
      parameters:
        - name: rev
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Статус по машинам
          content:
            application/json:
              schema:
                type: object
                required: [revision, applied, total, targets]
                properties:
                  revision: { type: integer }
                  applied: { type: integer, description: Сколько машин применили }
                  total: { type: integer }
                  targets:
                    type: array
                    items: { $ref: '#/components/schemas/TargetStatus' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/machines:
    get:
      summary: Машины флота и последний отчёт их агентов
      description: |
        Все машины по коду, включая машины без ресурсов (выходы без telemt и mtg)
        и машины, где агента ещё нет (`seen_at: null`). По каждой - версия агента,
        мост, результат локальных проверок, состояние ресурсов и версии telemt и mtg
        из последнего runtime-отчёта. Фильтры: `resource` - машине назначен ресурс,
        `enabled`, `kind`; `paging.total` считается с фильтром. Неизвестное
        значение фильтра - 400.
      operationId: listMachines
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - { name: resource, in: query, schema: { type: string, enum: [telemt.users, mtg.config, xui.clients] } }
        - { name: enabled, in: query, schema: { type: boolean } }
        - { name: kind, in: query, schema: { type: string, enum: [exit, relay, panel] } }
      responses:
        '200':
          description: Страница машин
          content:
            application/json:
              schema:
                type: object
                required: [data, paging]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Machine' }
                  paging: { $ref: '#/components/schemas/Paging' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/machines/{code}/runtime:
    get:
      summary: Последний runtime-снимок машины
      description: |
        Нагрузка машины, состояние telemt и mtg без списков пользователей.
        `stale: true` - снимок старше порога (по умолчанию три периода отчёта, 180 с)
        или его ещё нет (`seen_at: null`).
        `telemt`/`mtg` - null, если на машине нет продукта или отчёта ещё не было.
      operationId: getMachineRuntime
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Снимок машины
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MachineRuntime' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/connections:
    get:
      summary: Подключения пользователей по последним снимкам машин
      description: |
        Строка на машину, продукт и пользователя. Порядок: machine, product, key.
        В снимок попадают только пользователи с подключениями или адресами.
      operationId: listConnections
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - { name: machine, in: query, schema: { type: string } }
        - { name: product, in: query, schema: { $ref: '#/components/schemas/Product' } }
        - { name: min_connections, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          description: Страница подключений
          content:
            application/json:
              schema:
                type: object
                required: [data, paging]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Connection' }
                  paging: { $ref: '#/components/schemas/Paging' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/connections/summary:
    get:
      summary: Сводка подключений по машинам
      description: |
        Строка на машину и продукт, у которых есть runtime-снимок. Порядок machine, product.
        Строка есть и тогда, когда API продукта на машине не ответил: `api_ok: false`,
        причина в `error`, `connections_total` и `users_online` - по последнему удачному
        снимку (или 0). Клиенту в этом случае стоит взять подключения другим путём.
      operationId: getConnectionsSummary
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Страница сводки
          content:
            application/json:
              schema:
                type: object
                required: [data, paging]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ConnectionSummary' }
                  paging: { $ref: '#/components/schemas/Paging' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/log-errors:
    get:
      summary: Ошибки журнала telemt за окно
      description: |
        Суммы счётчиков из runtime-отчётов за периоды, закончившиеся после `since`.
        Мастер хранит счётчики 24 часа: `since` раньше - 400. Порядок: count по
        убыванию, machine, key, kind. Пустой `key` - строка без пользователя.
      operationId: listLogErrors
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - { name: since, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: machine, in: query, schema: { type: string } }
      responses:
        '200':
          description: Страница сумм
          content:
            application/json:
              schema:
                type: object
                required: [data, paging]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/LogErrorSum' }
                  paging: { $ref: '#/components/schemas/Paging' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/pairs:
    get:
      summary: Пары флота - релей и его выходы
      description: |
        Пара - релей (kind=relay) и выходы, у которых relay_code указывает на него.
        Страница идёт по релеям, отсортированным по коду. Выходы без релея и машины
        вида panel попадают в отдельную псевдо-пару с `relay: null` в конце списка
        (её не бывает, если таких машин нет).
      operationId: listPairs
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Страница пар
          content:
            application/json:
              schema:
                type: object
                required: [data, paging]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Pair' }
                  paging: { $ref: '#/components/schemas/Paging' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/drift:
    get:
      summary: Машины, где применённое расходится с желаемым
      description: |
        Строка на (машина, ресурс) с проблемой, которая держится дольше порога:
        - `behind` - применённая ревизия меньше желаемой, `since` - время создания желаемой;
        - `failed` - агент сообщил status=failed (resource - ресурс) или не прошла локальная
          проверка (resource - `check:<имя>`, desired_revision 0); `since` - последняя смена
          состояния в apply_log, без записи - seen_at;
        - `silent` - агент не отчитывался дольше порога (одна строка на машину, resource пустой).
        Машина без агента не silent, но её назначенные ресурсы попадают в `behind` с
        `observed_revision: null`.
        Выключенные машины (enabled=false) не попадают.
      operationId: listDrift
      parameters:
        - { name: threshold, in: query, description: "Порог в секундах", schema: { type: integer, minimum: 0, maximum: 86400, default: 600 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Страница расхождений
          content:
            application/json:
              schema:
                type: object
                required: [data, paging, threshold_seconds]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DriftItem' }
                  paging: { $ref: '#/components/schemas/Paging' }
                  threshold_seconds: { type: integer }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/targets/{code}/apply-log:
    get:
      summary: История применений и проверок машины
      description: Записи apply_log машины, новые первыми. Неизвестная машина - 404.
      operationId: getApplyLog
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Страница журнала
          content:
            application/json:
              schema:
                type: object
                required: [data, paging]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ApplyLogEntry' }
                  paging: { $ref: '#/components/schemas/Paging' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/desired:
    get:
      summary: Желаемое состояние машины (long-poll агента)
      description: |
        Ответ сразу, если есть ревизия новее `rev`; иначе запрос ждёт до `wait`
        (максимум 60 с) и возвращает 304. Токен машины даёт доступ только к её бандлу.
      operationId: getDesired
      security:
        - agentToken: []
      parameters:
        - { name: target, in: query, required: true, schema: { type: string } }
        - { name: rev, in: query, required: true, schema: { type: integer, minimum: 0 } }
        - { name: wait, in: query, schema: { type: string, example: 55s } }
      responses:
        '200':
          description: Бандл новее известной агенту ревизии
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bundle' }
        '304': { description: Новее нет }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/observed:
    post:
      summary: Отчёт агента о состоянии машины
      operationId: postObserved
      security:
        - agentToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ObservedReport' }
      responses:
        '204': { description: Отчёт принят }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/runtime:
    post:
      summary: Runtime-отчёт агента (раз в минуту)
      description: |
        Нагрузка машины, состояние telemt и mtg, подключения пользователей,
        счётчики ошибок журнала. Мастер хранит только последний снимок машины
        (строки пользователей продукта заменяются, только если API продукта
        ответил - `api_ok: true`), счётчики журнала - 24 часа. Повтор того же
        периода журнала не удваивает счётчики.
        Лимиты: до 5000 пользователей в каждом продукте, до 20 адресов на
        пользователя, до 5000 строк журнала - иначе 400; тело больше 2 МБ - 413
        (агент сам урезает отчёт: адреса, затем пользователей с меньшим числом
        подключений, затем журнал - и пишет об этом в `error` продукта).
        Проверки значений (400 с кодом): `host_invalid` - проценты вне 0..100,
        отрицательные или нечисловые значения нагрузки; `log_period_invalid` -
        `period_end` в будущем больше чем на 5 мин, старше часа (+5 мин) или
        период длиннее 65 мин; `log_count_invalid` - счётчик больше 1e9.
        Старый мастер или мост без этой ручки отвечает 404/405 - агент
        увеличивает паузу между попытками до 30 мин.
      operationId: postRuntime
      security:
        - agentToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuntimeReport' }
      responses:
        '204': { description: Отчёт принят }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    botToken:
      type: http
      scheme: bearer
      description: Токен бота (TELEMUX_BOT_TOKEN)
    agentToken:
      type: http
      scheme: bearer
      description: Токен машины (telemux agent-token)
    session:
      type: apiKey
      in: cookie
      name: telemux_session
  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    UserKey:
      name: key
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Key' }
  responses:
    Error:
      description: Ошибка
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Key:
      type: string
      pattern: '^[a-z0-9_]{1,64}$'
      description: Имя пользователя в telemt; `placeholder` и суффикс `_legacy` зарезервированы
    Secret:
      type: string
      pattern: '^[0-9a-f]{32}$'
    UserBody:
      type: object
      required: [secret]
      properties:
        secret: { $ref: '#/components/schemas/Secret' }
        expires_at: { type: string, format: date-time, nullable: true }
        max_tcp_conns: { type: integer, minimum: 1, nullable: true }
        previous_secret:
          description: Старый секрет после смены ключа, действует до previous_secret_expires_at
          allOf: [{ $ref: '#/components/schemas/Secret' }]
        previous_secret_expires_at: { type: string, format: date-time, nullable: true }
    User:
      allOf:
        - type: object
          required: [key]
          properties:
            key: { $ref: '#/components/schemas/Key' }
        - $ref: '#/components/schemas/UserBody'
    Publish:
      type: object
      required: [revision, changed]
      properties:
        revision: { type: integer, description: "Последняя ревизия: новая или прежняя, если ничего не изменилось" }
        changed:
          type: array
          description: Машины, получившие новую ревизию
          items: { type: string }
    PointChange:
      allOf:
        - $ref: '#/components/schemas/Publish'
        - type: object
          required: [created]
          properties:
            created: { type: boolean }
    TargetStatus:
      type: object
      required: [code, desired_revision, observed_revision, status, seen_at, applied]
      properties:
        code: { type: string }
        desired_revision: { type: integer }
        observed_revision: { type: integer, nullable: true }
        status:
          type: string
          enum: [applied, failed, pending, compared, unknown]
        seen_at: { type: string, format: date-time, nullable: true }
        applied: { type: boolean }
    Bundle:
      type: object
      required: [target, revision, resources]
      properties:
        target: { type: string }
        revision: { type: integer }
        resources:
          type: array
          items:
            type: object
            required: [resource, revision, sha256, content]
            properties:
              resource: { type: string, example: telemt.users }
              revision: { type: integer }
              sha256: { type: string }
              content: { type: string, format: byte, description: Содержимое файла в base64 }
    ObservedReport:
      type: object
      required: [target, resources]
      properties:
        target: { type: string }
        agent_version: { type: string }
        via: { type: string, description: Через какой мост пришёл отчёт }
        resources:
          type: array
          description: Пусто у машины без ресурсов - отчёт только о самой машине
          maxItems: 50
          items:
            type: object
            required: [resource, revision, status]
            properties:
              resource: { type: string }
              revision: { type: integer, minimum: 0 }
              sha256: { type: string }
              status: { type: string, enum: [applied, failed, pending, compared] }
              error: { type: string, description: "Причина отказа или описание расхождения (в режиме сравнения)" }
        checks:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/ObservedCheck' }
    ObservedCheck:
      type: object
      description: Локальная проверка машины (например, мост на машине-выходе)
      required: [name, ok]
      properties:
        name: { type: string, maxLength: 64, example: bridge }
        ok: { type: boolean }
        error: { type: string, maxLength: 1024 }
    Machine:
      type: object
      required: [code, kind, enabled, resources, seen_at, checks, observed]
      properties:
        code: { type: string }
        kind: { type: string, enum: [exit, relay, panel] }
        relay_code: { type: string, description: "Для выхода - релей, к которому он держит туннель" }
        enabled: { type: boolean }
        resources:
          type: array
          items: { type: string }
        agent_version: { type: string }
        via: { type: string }
        seen_at: { type: string, format: date-time, nullable: true, description: "Последний отчёт агента; null - агента нет" }
        checks:
          type: array
          items: { $ref: '#/components/schemas/ObservedCheck' }
        observed:
          type: array
          items:
            type: object
            required: [resource, revision, status, seen_at]
            properties:
              resource: { type: string }
              revision: { type: integer }
              sha256: { type: string, description: "sha256 ресурса, о котором отчитался агент" }
              status: { type: string, enum: [applied, failed, pending, compared] }
              error: { type: string }
              seen_at: { type: string, format: date-time }
              desired_revision:
                type: integer
                nullable: true
                description: Последняя желаемая ревизия этого ресурса для машины; null - не публиковалась
        telemt_version: { type: string, description: Версия telemt из последнего runtime-отчёта }
        mtg_version: { type: string, description: Версия mtg-multi из последнего runtime-отчёта }
        runtime_seen_at: { type: string, format: date-time, nullable: true, description: "Последний runtime-отчёт; null - не было" }
    NewTarget:
      type: object
      required: [code, kind, resources]
      properties:
        code: { type: string, pattern: '^[a-z][a-z0-9-]{1,31}$' }
        kind: { type: string, enum: [exit, relay] }
        relay_code: { type: string, description: "Для выхода - его релей" }
        address: { type: string, description: "Для выхода - публичный IPv4" }
        bridge_socks: { type: string, description: "Для выхода - socks-вход на релее к этому выходу, socks5://127.0.0.1:<порт>" }
        resources:
          type: array
          items: { type: string, enum: [telemt.users, mtg.config] }
    JoinCommand:
      type: object
      required: [target, command, expires_at]
      properties:
        target: { type: string }
        command: { type: string, description: "Одна строка для root на новой машине; пусто - у нового релея ещё нет выходов" }
        expires_at: { type: string, format: date-time }
        firewall: { type: string, enum: [opened, not_configured, failed, not_needed], description: "Открыт ли адрес выхода на мастере" }
    Paging:
      type: object
      required: [total, limit, offset]
      properties:
        total: { type: integer, description: Всего строк с учётом фильтров }
        limit: { type: integer }
        offset: { type: integer }
    Product:
      type: string
      enum: [telemt, mtg]
    RuntimeHost:
      type: object
      required: [cpu_pct, mem_pct, disk_pct, load1, net_rx_mbps, net_tx_mbps, uptime_s]
      properties:
        cpu_pct: { type: number, minimum: 0, maximum: 100, description: "Загрузка CPU между двумя отчётами, %" }
        mem_pct: { type: number, minimum: 0, maximum: 100 }
        disk_pct: { type: number, minimum: 0, maximum: 100, description: "Занято на корневой ФС, %" }
        load1: { type: number, minimum: 0 }
        net_rx_mbps: { type: number, minimum: 0, maximum: 1000000, description: "Интерфейс маршрута по умолчанию, между отчётами" }
        net_tx_mbps: { type: number, minimum: 0, maximum: 1000000 }
        uptime_s: { type: integer, minimum: 0 }
    RuntimeUser:
      type: object
      required: [key, connections]
      properties:
        key: { type: string, maxLength: 128 }
        connections: { type: integer, minimum: 0 }
        active_ips:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 64 }
        bytes_in: { type: integer, minimum: 0, description: Только mtg }
        bytes_out: { type: integer, minimum: 0, description: Только mtg }
        last_seen: { type: string, format: date-time, nullable: true, description: Только mtg }
    RuntimeTelemt:
      type: object
      required: [version, api_ok, error, users_configured, users_effective, connections_total]
      properties:
        version: { type: string, description: "`telemt --version`; пусто - бинарь не найден" }
        api_ok: { type: boolean, description: "API telemt ответил; false - причина в error" }
        error: { type: string, maxLength: 1024 }
        users_configured: { type: integer, description: Пользователей в telemt без placeholder }
        users_effective: { type: integer, description: Из них не истёкших по users.toml }
        connections_total: { type: integer }
        config_sha256: { type: string, description: sha256 telemt.toml }
        keepalive: { type: integer }
        ack: { type: integer }
        tls_domain: { type: string }
        max_tcp_conns_median: { type: integer, description: Медиана лимитов подключений в users.toml }
        users:
          type: array
          description: Только в отчёте агента; в ответах мастера не отдаётся
          maxItems: 5000
          items: { $ref: '#/components/schemas/RuntimeUser' }
    RuntimeMtg:
      type: object
      required: [version, api_ok, error, connections_total]
      properties:
        version: { type: string }
        api_ok: { type: boolean }
        error: { type: string, maxLength: 1024 }
        connections_total: { type: integer }
        users:
          type: array
          description: Только в отчёте агента; в ответах мастера не отдаётся
          maxItems: 5000
          items: { $ref: '#/components/schemas/RuntimeUser' }
    LogErrorKind:
      type: string
      enum: [limit, handshake, auth, timeout, other]
    RuntimeReport:
      type: object
      required: [target]
      properties:
        target: { type: string }
        agent_version: { type: string }
        host:
          allOf: [{ $ref: '#/components/schemas/RuntimeHost' }]
          nullable: true
        telemt:
          allOf: [{ $ref: '#/components/schemas/RuntimeTelemt' }]
          nullable: true
          description: null - на машине нет telemt
        mtg:
          allOf: [{ $ref: '#/components/schemas/RuntimeMtg' }]
          nullable: true
          description: null - на машине нет mtg
        log_errors:
          type: object
          nullable: true
          description: Счётчики журнала telemt за период с прошлого отчёта; null - нет telemt или журнал не прочитан
          required: [period_start, period_end, items]
          properties:
            period_start: { type: string, format: date-time }
            period_end:
              type: string
              format: date-time
              description: "Не позже now+5 мин и не раньше now-1 ч-5 мин; период не длиннее 65 мин"
            items:
              type: array
              maxItems: 5000
              items:
                type: object
                required: [key, kind, count]
                properties:
                  key: { type: string, maxLength: 128, description: "user=<key> из строки; пусто - без пользователя" }
                  kind: { $ref: '#/components/schemas/LogErrorKind' }
                  count: { type: integer, minimum: 0, maximum: 1000000000 }
    MachineRuntime:
      type: object
      required: [code, seen_at, stale, agent_version, host, telemt, mtg]
      properties:
        code: { type: string }
        seen_at: { type: string, format: date-time, nullable: true }
        stale: { type: boolean, description: "Снимок старше порога (по умолчанию 180 с) или его нет" }
        agent_version: { type: string }
        host:
          allOf: [{ $ref: '#/components/schemas/RuntimeHost' }]
          nullable: true
        telemt:
          allOf: [{ $ref: '#/components/schemas/RuntimeTelemt' }]
          nullable: true
        mtg:
          allOf: [{ $ref: '#/components/schemas/RuntimeMtg' }]
          nullable: true
    Connection:
      type: object
      required: [machine, product, key, connections, active_ips, bytes_in, bytes_out, last_seen, seen_at, stale]
      properties:
        machine: { type: string }
        product: { $ref: '#/components/schemas/Product' }
        key: { type: string }
        connections: { type: integer }
        active_ips:
          type: array
          items: { type: string }
        bytes_in: { type: integer, description: "Только mtg, у telemt 0" }
        bytes_out: { type: integer }
        last_seen: { type: string, format: date-time, nullable: true }
        seen_at: { type: string, format: date-time, description: Когда пришёл снимок }
        stale: { type: boolean, description: "Строка старше порога (по умолчанию 180 с): API продукта давно не отвечал или агент молчит" }
    ConnectionSummary:
      type: object
      required: [machine, product, connections_total, users_online, seen_at, stale, api_ok]
      properties:
        machine: { type: string }
        product: { $ref: '#/components/schemas/Product' }
        connections_total: { type: integer, description: "При api_ok=false - сумма по последнему удачному снимку (или 0)" }
        users_online: { type: integer, description: "Пользователей с подключениями; при api_ok=false - по последнему удачному снимку" }
        seen_at: { type: string, format: date-time, description: Когда пришёл последний снимок машины }
        stale: { type: boolean }
        api_ok: { type: boolean, description: "API продукта ответил в последнем снимке; false - причина в error" }
        error: { type: string, description: "Ошибка продукта из последнего снимка; нет поля - ошибок не было" }
    LogErrorSum:
      type: object
      required: [machine, key, kind, count]
      properties:
        machine: { type: string }
        key: { type: string }
        kind: { $ref: '#/components/schemas/LogErrorKind' }
        count: { type: integer }
    PairMachine:
      description: Машина в паре - то же, что Machine, плюс желаемая ревизия по ресурсам и сводный статус.
      allOf:
        - $ref: '#/components/schemas/Machine'
        - type: object
          required: [status, desired]
          properties:
            status:
              type: string
              enum: [ok, behind, failed, silent, no_agent, disabled]
              description: |
                disabled - enabled=false; no_agent - агент ни разу не отчитывался; silent - отчёт
                старше 10 минут; failed - хоть один ресурс failed или проверка не пройдена;
                behind - хоть один ресурс отстаёт от желаемой ревизии; иначе ok.
            desired:
              type: array
              items:
                type: object
                required: [resource, revision]
                properties:
                  resource: { type: string }
                  revision: { type: integer }
    Pair:
      type: object
      required: [relay, exits]
      properties:
        relay:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/PairMachine' }]
          description: null - псевдо-пара «без релея» (выходы без relay_code и машины panel)
        exits:
          type: array
          items: { $ref: '#/components/schemas/PairMachine' }
    DriftItem:
      type: object
      required: [target, kind, reason, resource, desired_revision, since]
      properties:
        target: { type: string }
        kind: { type: string, enum: [exit, relay, panel] }
        relay_code: { type: string }
        reason: { type: string, enum: [behind, failed, silent] }
        resource: { type: string, description: "Пусто для silent" }
        desired_revision: { type: integer, description: "0 для silent" }
        observed_revision: { type: integer, nullable: true }
        since: { type: string, format: date-time }
        seen_at: { type: string, format: date-time, nullable: true }
        error: { type: string }
    ApplyLogEntry:
      type: object
      required: [at, resource, status]
      properties:
        at: { type: string, format: date-time }
        resource: { type: string, description: "Ресурс или check:<имя> для локальной проверки" }
        revision: { type: integer, nullable: true }
        status: { type: string }
        error: { type: string }
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Машинный код
          enum: [bad_request, unauthorized, forbidden, not_found, conflict, gone, unprocessable,
                 not_implemented, unavailable, internal, not_master, mass_delete_guard,
                 payload_too_large]
        message: { type: string }
        error: { type: string, description: Копия message для старой панели }
